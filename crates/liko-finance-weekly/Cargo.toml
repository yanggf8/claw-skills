[package]
name = "liko-finance-weekly"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "liko-finance-weekly"
path = "src/main.rs"

[lib]
name = "liko_finance_weekly"
path = "src/lib.rs"

[dependencies]
claw-core = { path = "../../../../b/gwebcdb/crates/claw-core" }
jiff = { version = "0.1", features = ["tzdb-bundle-always"] }

[dev-dependencies]
# Tests render the body as CommonMark, because the defect was in how dev.to
# renders it — a string comparison would only restate the implementation.
pulldown-cmark = { version = "0.9", default-features = false }
